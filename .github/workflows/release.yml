name: Release jar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the built jar to
        required: true
        default: v2.0.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        working-directory: CorzClient-SourcedByDexter
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" CorzClient-SourcedByDexter/build/libs/corz-client-2.0.1.jar --clobber
